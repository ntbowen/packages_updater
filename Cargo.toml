[package]
name = "packages_updater"
version = "0.1.0"
edition = "2021"
description = "OpenWrt packages repository sync tool"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
semver = { version = "1", features = ["serde"] }
git2 = "0.19"
rust-i18n = "3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_xlsxwriter = "0.80"
csv = "1"
anyhow = "1"
chrono = "0.4"
regex = "1"
walkdir = "2"
once_cell = "1"
tui-textarea = "0.7"
unicode-width = "0.2"
dirs = "5"

[profile.release]
opt-level = 3
strip = true
